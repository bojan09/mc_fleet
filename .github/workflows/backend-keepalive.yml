name: Backend keep-alive

# Free Supabase projects can be paused after about a week of low activity.
# This makes a tiny real request to the database every 12 hours to lower that
# risk. Supabase does not promise that scheduled requests prevent pausing, so
# treat this as risk reduction, not a guarantee.
#
# Supabase: calls a database function over the REST API and checks that the
# answer came from Postgres (a JSON result), not just that the server replied.
# The default call is the public verify_certificate function with a code that
# cannot exist, so nothing is read or written.
#
# Appwrite (optional): if APPWRITE_ENDPOINT, APPWRITE_PROJECT_ID and the
# APPWRITE_API_KEY secret are set, it also lists one document from
# APPWRITE_DATABASE_ID / APPWRITE_COLLECTION_ID (key needs documents.read only).
#
# Settings (repository variables unless noted):
#   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY (public key; may also be a secret)
#   SUPABASE_RPC (function name), SUPABASE_RPC_BODY (JSON arguments)
#   APPWRITE_ENDPOINT, APPWRITE_PROJECT_ID, APPWRITE_DATABASE_ID,
#   APPWRITE_COLLECTION_ID, secret APPWRITE_API_KEY
#
# Note: GitHub turns off scheduled workflows in a repository with no commits
# for 60 days. If that happens, re-enable it in the Actions tab.
on:
  schedule:
    - cron: '17 */12 * * *'   # 00:17 and 12:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: backend-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Supabase database request
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://lqlewiyuhifvnodkpiul.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_HOxayhHD0PfFFvm0nC45JQ_8JgHf56_' }}
          RPC: ${{ vars.SUPABASE_RPC || 'verify_certificate' }}
          RPC_BODY: ${{ vars.SUPABASE_RPC_BODY || '{"p_code":"KEEPALIVE10"}' }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Supabase not configured; skipping."; exit 0
          fi
          out=$(curl -sS -m 30 --retry 3 --retry-delay 10 --retry-all-errors \
            -o body.json -w '%{http_code} %{time_total}' \
            -X POST "$SUPABASE_URL/rest/v1/rpc/$RPC" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" \
            -d "$RPC_BODY")
          code=${out%% *}
          echo "HTTP $code in ${out#* }s from $RPC"
          if [ "$code" != 200 ] || ! jq -e 'type == "array" or type == "object" or type == "null" or type == "boolean"' body.json >/dev/null \
             || jq -e 'type == "object" and has("code") and has("message")' body.json >/dev/null; then
            echo "::error::Supabase request did not return a database result."
            head -c 300 body.json; echo; exit 1
          fi
          echo "Database answered: $(jq -c 'if type == "array" then "\(length) row(s)" else type end' body.json)"

      - name: Appwrite database request
        env:
          ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          PROJECT: ${{ vars.APPWRITE_PROJECT_ID }}
          DB: ${{ vars.APPWRITE_DATABASE_ID }}
          COLL: ${{ vars.APPWRITE_COLLECTION_ID }}
          KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          if [ -z "$ENDPOINT" ] || [ -z "$PROJECT" ] || [ -z "$KEY" ] || [ -z "$DB" ] || [ -z "$COLL" ]; then
            echo "Appwrite not configured; skipping."; exit 0
          fi
          out=$(curl -sS -m 30 --retry 3 --retry-delay 10 --retry-all-errors \
            -o body.json -w '%{http_code} %{time_total}' -G \
            "$ENDPOINT/databases/$DB/collections/$COLL/documents" \
            --data-urlencode 'queries[]={"method":"limit","values":[1]}' \
            -H "X-Appwrite-Project: $PROJECT" -H "X-Appwrite-Key: $KEY")
          code=${out%% *}
          echo "HTTP $code in ${out#* }s"
          if [ "$code" != 200 ] || ! jq -e 'has("total")' body.json >/dev/null; then
            echo "::error::Appwrite request did not return a database result."
            head -c 300 body.json; echo; exit 1
          fi
          echo "Database answered: total $(jq .total body.json)"
