name: Supabase keep-alive

# Free Supabase projects pause after 7 days without database activity. This
# runs a tiny read-only query every 3 days so cloud sync and certificate
# checks stay online. It calls the public verify_certificate function with a
# code that cannot exist (codes never contain 0 or 1), so nothing is read or written.
#
# Note: GitHub turns off scheduled workflows in a repository with no commits
# for 60 days. If that happens, re-enable it in the Actions tab.
on:
  schedule:
    - cron: '17 6 */3 * *'   # 06:17 UTC every third day
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          # Optional repository variables; defaults are the project's public URL and publishable key.
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://lqlewiyuhifvnodkpiul.supabase.co' }}
          SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_HOxayhHD0PfFFvm0nC45JQ_8JgHf56_' }}
        run: |
          curl -fsS --retry 3 --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/verify_certificate" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_code":"KEEPALIVE10"}'
          echo
          echo "Supabase answered."
